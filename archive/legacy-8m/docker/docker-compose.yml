services:
  target:
    # Official Docker image, no local build:
    #   https://github.com/docker-library/php  (tag 8.4.26-apache)
    # Debian 12 base, Apache prefork + mod_php, PHP 8.4.26.
    image: php:8.4.26-apache
    platform: linux/amd64
    container_name: php2shell-target
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./php.ini:/usr/local/etc/php/conf.d/zz-php2shell.ini:ro
      - ../../../docker/apache.conf:/etc/apache2/conf-enabled/zz-php2shell.conf:ro
      - ../../../docker/www:/var/www/html:ro
      - ../../../out:/out
    # The host ./out directory is created by Docker as root; let the Apache
    # worker (www-data) write the proof file and make it readable here.
    command:
      - /bin/sh
      - -c
      - chown -R www-data:www-data /out 2>/dev/null || true; exec apache2-foreground
    restart: unless-stopped
