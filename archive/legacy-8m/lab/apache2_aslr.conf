ServerRoot "/etc/apache2"
DefaultRuntimeDir /home/debian/php2shell/lab
Listen 127.0.0.1:8090
PidFile /home/debian/php2shell/lab/httpd.pid
ErrorLog /home/debian/php2shell/lab/error.log
CustomLog /home/debian/php2shell/lab/access.log combined
LogLevel warn
KeepAlive Off
ServerName localhost
TypesConfig /etc/apache2/mime.types
LoadModule mpm_prefork_module /usr/lib/apache2/modules/mod_mpm_prefork.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule unixd_module /usr/lib/apache2/modules/mod_unixd.so
LoadModule dir_module /usr/lib/apache2/modules/mod_dir.so
LoadModule mime_module /usr/lib/apache2/modules/mod_mime.so
LoadModule log_config_module /usr/lib/apache2/modules/mod_log_config.so
LoadModule php_module /usr/lib/apache2/modules/libphp.so
User www-data
Group www-data
<IfModule mpm_prefork_module>
StartServers 1
MinSpareServers 1
MaxSpareServers 1
ServerLimit 1
MaxRequestWorkers 1
MaxConnectionsPerChild 0
</IfModule>
DocumentRoot /var/www/aslr-lab/www
<Directory /var/www/aslr-lab/www>
Options -Indexes
AllowOverride None
Require all granted
</Directory>
<FilesMatch \.php$>
SetHandler application/x-httpd-php
</FilesMatch>
<IfModule php_module>
php_admin_flag engine on
php_admin_value memory_limit 8M
php_admin_value post_max_size 64M
php_admin_value upload_max_filesize 64M
php_admin_value session.save_path /tmp
php_admin_value session.use_strict_mode 0
php_admin_value session.use_cookies 0
php_admin_value session.upload_progress.enabled On
php_admin_value session.upload_progress.cleanup On
</IfModule>
