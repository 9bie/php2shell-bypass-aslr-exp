# NON-OFFICIAL single-worker override (test baseline only).
# Only mounted by ../run_pure.sh --single.  The default target uses the
# official image's mpm_prefork.conf (StartServers 5 / MaxRequestWorkers 150).
# docker/apache.conf is kept as a compatibility symlink for older harnesses.
#
# Loaded from /etc/apache2/conf-enabled/ after mods-enabled, so these values
# override the distro defaults in mods-enabled/mpm_prefork.conf.
KeepAlive Off

<IfModule mpm_prefork_module>
    StartServers           1
    MinSpareServers        1
    MaxSpareServers        1
    MaxRequestWorkers      1
    ServerLimit            1
    MaxConnectionsPerChild 0
</IfModule>
